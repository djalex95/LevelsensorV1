name: Host-Tests

# Laeuft bei jedem Push auf einen Zweig, also auch auf Arbeitszweigen -
# damit ein Fehler auffaellt, lange bevor daraus ein Release wird.
#
# Tag-Pushes sind bewusst ausgenommen: '**' trifft nur Zweige, keine Tags.
# Bei einem Versions-Tag laeuft stattdessen release.yml, das die Tests
# seinerseits als erste Stufe vor dem Bauen ausfuehrt. So bleibt die
# Freigabe an bestandene Tests gebunden, ohne dass beide Workflows
# gleichzeitig dasselbe tun.

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gcc bringt ubuntu-latest schon mit. Die Host-Tests brauchen sonst
      # nichts: keine ARM-Toolchain, keine Fremdbibliotheken.
      - name: Host-Tests
        run: sh tests/run_tests.sh

      # Die Variantenabfrage im Makefile pruefen. Das geht ohne
      # ARM-Toolchain, weil beide Faelle schon beim Einlesen des Makefiles
      # abbrechen - es wird nichts uebersetzt. Ohne diesen Schritt fiele ein
      # Fehler in der Bedingung erst beim naechsten Release-Tag auf.
      #
      # Auf die Meldung wird bewusst genau geprueft: ohne ARM-Toolchain
      # scheitert "make" sonst einfach am fehlenden Compiler, und der Test
      # waere gruen, obwohl die Abfrage gar nicht mehr greift.
      - name: Makefile verlangt HW_VARIANT
        run: |
          set -e

          erwarte_abbruch() {
            beschreibung=$1
            muster=$2
            shift 2
            if ausgabe=$("$@" 2>&1); then
              echo "FEHLER: $beschreibung lief durch, statt abzubrechen." >&2
              echo "$ausgabe" >&2
              exit 1
            fi
            case "$ausgabe" in
              *"$muster"*)
                echo "ok: $beschreibung bricht mit der erwarteten Meldung ab" ;;
              *)
                echo "FEHLER: $beschreibung brach ab, aber nicht an der Variantenabfrage." >&2
                echo "$ausgabe" >&2
                exit 1 ;;
            esac
          }

          erwarte_abbruch "make ohne HW_VARIANT" \
            "HW_VARIANT nicht gesetzt" make
          erwarte_abbruch "make mit unbekannter HW_VARIANT" \
            "Unbekannte HW_VARIANT" make HW_VARIANT=1002

          # Gegenprobe: die variantenfreien Ziele muessen ohne Angabe laufen.
          make clean
          echo "ok: make clean laeuft ohne HW_VARIANT"

  # Cross-Build aller Varianten. Der ARM-Uebersetzungslauf findet sonst nur
  # beim Release-Tag statt (release.yml) - ein Fehler in einer einzelnen
  # Variante faellt damit erst bei der Freigabe auf. Hier laeuft er bei
  # jedem Push auf einen Zweig.
  #
  # Erst nach den Host-Tests, damit die Toolchain nicht geladen wird,
  # wenn schon die schnelle Stufe rot ist.
  crossbuild:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Dieselbe Version wie in release.yml, damit ein gruener Lauf hier
      # auch wirklich fuer das Release gilt.
      - name: ARM-Toolchain installieren
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      # Der Dateiname traegt zusaetzlich den Commit. So laesst sich ein
      # Testbuild nicht mit einem Release-Binary verwechseln, das nur
      # "Fuellstandsensor_v<version>_hwv<nnnn>.bin" heisst.
      - name: Firmware bauen (alle Varianten)
        run: |
          set -e
          fw=$(grep -oP '^#define\s+FW_VERSION\s+"\K[^"]+' Core/Inc/version.h | head -n1)
          sha=$(echo "$GITHUB_SHA" | cut -c1-7)
          mkdir -p dist
          for hwv in 1000 1001 1003; do
            make -j4 HW_VARIANT=$hwv
            cp "build/$hwv/CAN_FuellstandsensorBLE.bin" \
               "dist/Fuellstandsensor_v${fw}+${sha}_hwv${hwv}.bin"
          done
          ls -l dist

      # Kein Release, sondern ein Anhang am Lauf selbst: Actions-Tab, den
      # Lauf oeffnen, Abschnitt "Artifacts" unten auf der Uebersichtsseite.
      # Die App sieht diese Dateien nicht, sie liest ausschliesslich
      # Release-Assets.
      - name: Binaries anhaengen
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/*.bin
          retention-days: 14
