name: Build & Release Firmware

# Release wird durch einen Versions-Tag ausgelöst (z. B. v1.2.2).
# Push auf main baut KEIN Release mehr.
# Tag muss zur FW_VERSION in Core/Inc/version.h passen.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version ermitteln
        id: ver
        run: |
          fw=$(grep -oP '^#define\s+FW_VERSION\s+"\K[^"]+' Core/Inc/version.h | head -n1)
          echo "fw=$fw" >> "$GITHUB_OUTPUT"
          echo "Firmware-Version: $fw"

      - name: Tag == version.h prüfen
        if: github.ref_type == 'tag'
        run: |
          test "${GITHUB_REF_NAME#v}" = "${{ steps.ver.outputs.fw }}" \
            || { echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu FW_VERSION ${{ steps.ver.outputs.fw }}"; exit 1; }

      - name: Host-Tests
        run: sh tests/run_tests.sh

      - name: ARM-Toolchain installieren
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      # Jede Hardwarevariante bekommt ein eigenes Binary. Der Name enthält
      # die Variante, damit App und Bootloader sie zuordnen können:
      #   Fuellstandsensor_v1.2.10_hwv1001.bin
      #
      # Variante 1000 (Platine V1) wird wieder mitgebaut. Der Quellstand
      # traegt die V2-Pinbelegung; die davon abweichenden Pins der
      # V1-Platine zieht board_pins.c aus den von CubeMX geschuetzten
      # USER-CODE-Bloecken nach (CAN auf PD0/PD1 statt PA11/PA12,
      # CAN_STBY auf PD2 statt PB4). Der Branch v1-legacy bleibt als
      # eingefrorener Stand von v1.2.9 erhalten.
      #
      # Die App filtert die Auswahl nach der hwv-Kennung im Dateinamen
      # (github_releases.dart: assetsForVariant): Assets mit Kennung nur
      # fuer die exakt passende Variante, Assets ohne Kennung nur fuer die
      # V1-Linie. Das Namensschema "_hwv<nnnn>.bin" ist damit Schnittstelle
      # und darf nicht geaendert werden, ohne die App anzupassen.
      - name: Firmware bauen (alle Varianten)
        run: |
          mkdir -p dist
          # Variantenliste kommt aus Core/Inc/variants/ - eine neue Variante
          # (Ordner mit sensor_cfg.h) wird automatisch mitgebaut.
          for hwv in $(ls Core/Inc/variants); do
            make -j4 HW_VARIANT=$hwv
            cp "build/$hwv/CAN_FuellstandsensorBLE.bin" \
               "dist/Fuellstandsensor_v${{ steps.ver.outputs.fw }}_hwv${hwv}.bin"
          done
          ls -l dist

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.fw }}
          name: Firmware v${{ steps.ver.outputs.fw }}
          body_path: RELEASE_NOTES.md
          files: dist/Fuellstandsensor_v*.bin
